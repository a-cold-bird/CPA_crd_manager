services:
  cpa-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8333:8333"
    environment:
      PORT: "8333"
      CPA_CONFIG_FILE: /app/config/config.yaml
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker-data/config:/app/config
      - ./runtime:/app/runtime
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
